<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Panel · BoosT32</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6ff00'/%3E%3Ctext x='16' y='22' font-family='Arial Black' font-size='14' text-anchor='middle' fill='%230a0a0a'%3EB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin" id="app">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <a href="#/dashboard" class="brand" aria-label="BoosT32 — inicio del panel">
          <span class="brand__mark">B32</span>
          <span>
            <span class="brand__name">BOOST<span>32</span></span>
            <span class="brand__tag">Panel de gestión</span>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>

        <div class="sidebar__footer">
          <a class="store-link" href="../index.html">
            Ver tienda online
            <span data-icon="external" style="width: 16px; height: 16px"></span>
          </a>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- Main -->
      <div class="main">
        <header class="topbar">
          <button class="topbar__menu" id="menu-btn" aria-label="Abrir menú" data-icon="menu"></button>

          <div class="topbar__search">
            <span data-icon="search"></span>
            <input type="search" id="global-search" placeholder="Buscar productos, pedidos o clientes…" aria-label="Buscar" />
          </div>

          <div class="topbar__actions">
            <button class="icon-btn" aria-label="Notificaciones" id="notif-btn">
              <span data-icon="bell"></span>
              <span class="icon-btn__dot"></span>
            </button>
            <div class="user-chip">
              <span class="avatar avatar--accent">MR</span>
              <span class="user-chip__text">
                <span class="user-chip__name">Marcos Ruiz</span><br />
                <span class="user-chip__role">Dueño</span>
              </span>
            </div>
          </div>
        </header>

        <main class="content" id="view" tabindex="-1"></main>
      </div>
    </div>

    <script type="module" src="../js/admin/main.js"></script>
  </body>
</html>
